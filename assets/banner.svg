<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Recipe Box, a nixfredOS path</title>
  <desc id="desc">A recipe index box with cards, next to the title Recipe Box and the subtitle a nixfredOS path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#1a1d26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a65b"/>
      <stop offset="1" stop-color="#ef7b5b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#2b303b" stroke-width="2"/>

  <!-- soft dotted texture -->
  <g fill="#ffffff" opacity="0.04">
    <circle cx="760" cy="40" r="2"/><circle cx="800" cy="70" r="2"/><circle cx="840" cy="40" r="2"/>
    <circle cx="880" cy="70" r="2"/><circle cx="920" cy="40" r="2"/><circle cx="960" cy="70" r="2"/>
    <circle cx="1000" cy="40" r="2"/><circle cx="1040" cy="70" r="2"/><circle cx="1080" cy="40" r="2"/>
    <circle cx="1120" cy="70" r="2"/><circle cx="1160" cy="40" r="2"/>
    <circle cx="780" cy="280" r="2"/><circle cx="820" cy="250" r="2"/><circle cx="860" cy="280" r="2"/>
    <circle cx="900" cy="250" r="2"/><circle cx="940" cy="280" r="2"/><circle cx="980" cy="250" r="2"/>
    <circle cx="1020" cy="280" r="2"/><circle cx="1060" cy="250" r="2"/><circle cx="1100" cy="280" r="2"/>
  </g>

  <!-- recipe index box -->
  <g transform="translate(70 60)">
    <!-- back cards -->
    <g transform="rotate(-6 120 110)">
      <rect x="40" y="10" width="190" height="130" rx="8" fill="#232834" stroke="#3a4152" stroke-width="2"/>
      <rect x="40" y="10" width="62" height="20" rx="6" fill="#3a4152"/>
    </g>
    <g transform="rotate(3 140 110)">
      <rect x="56" y="22" width="190" height="130" rx="8" fill="#2a303d" stroke="#454d62" stroke-width="2"/>
      <rect x="56" y="22" width="62" height="20" rx="6" fill="#f5a65b" opacity="0.55"/>
    </g>
    <!-- front card -->
    <rect x="70" y="36" width="200" height="140" rx="8" fill="#f4ecdc" stroke="#d9cdb4" stroke-width="2"/>
    <rect x="70" y="36" width="70" height="22" rx="6" fill="url(#accent)"/>
    <text x="82" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1a1207">RECIPE</text>
    <g stroke="#b8a98a" stroke-width="2" stroke-linecap="round">
      <line x1="90" y1="88" x2="250" y2="88"/>
      <line x1="90" y1="108" x2="236" y2="108"/>
      <line x1="90" y1="128" x2="250" y2="128"/>
      <line x1="90" y1="148" x2="200" y2="148"/>
    </g>
    <path d="M232 52 l4.4 9 9.9 1.4 -7.2 7 1.7 9.8 -8.8 -4.7 -8.8 4.7 1.7 -9.8 -7.2 -7 9.9 -1.4z" fill="#ef7b5b"/>
    <!-- the box -->
    <path d="M30 112 L310 112 L296 200 Q294 212 282 212 L58 212 Q46 212 44 200 Z" fill="#171a21" stroke="#f5a65b" stroke-width="3" stroke-linejoin="round"/>
    <rect x="128" y="136" width="84" height="26" rx="6" fill="#0f1115" stroke="#f5a65b" stroke-width="2"/>
    <text x="170" y="154" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f5a65b">A to Z</text>
  </g>

  <!-- title -->
  <text x="430" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="84" font-weight="800" fill="#e8eaf0" letter-spacing="-1">Recipe Box</text>
  <rect x="434" y="174" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="432" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="500" fill="#9aa3b2">a nixfredOS path</text>
  <text x="432" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6e7787">TypeScript  /  Bun  /  Hono  /  SQLite</text>
</svg>
